<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="50 hand-picked browser games with no ad-clutter. Click a tile and play." />
  <title>Free Browser Games for All</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="logo" aria-label="Free Browser Games for All">
        <span>FREE</span>
        <span class="face" aria-hidden="true"><i></i><i></i><b></b></span>
        <span>BROWSER</span>
        <strong>GAMES</strong>
      </div>
      <p>50 genuinely fun browser games. No giant portal, no ad-clutter, just click and play.</p>
      <div class="stats"><span>50 games</span><span>•</span><span>free to open</span><span>•</span><span>browser-first</span></div>
    </header>

    <nav class="filters" aria-label="Filter games">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="action">Action</button>
      <button class="filter" data-filter="puzzle">Puzzle</button>
      <button class="filter" data-filter="strategy">Strategy</button>
      <button class="filter" data-filter="arcade">Arcade</button>
      <button class="filter" data-filter="multiplayer">Multiplayer</button>
      <button class="filter" data-filter="chill">Chill</button>
    </nav>

    <section id="games" class="game-grid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <span>Powered by <a href="https://hoppedev.app/" target="_blank" rel="noopener noreferrer">HoppeDev.app</a></span>
    <span class="footnote">Ad status checked from browser-game publisher/creator pages in October 2026. Sites can change.</span>
  </footer>

  <script src="games.js"></script>
</body>
</html>
